[mod]
id = "worldedit"
version = "1.1.0"
priority = 100

# The editor's own module: staged into `crates/horizon-client/src/game.rs` as
# `mod worldedit`, so it sees `Game`'s private fields and methods.
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "worldedit"
source = "runtime.rs"

# Schematic files: Sponge `.schem`, Litematica `.litematic` and legacy MCEdit
# `.schematic`, read and written beside the editor.
[[module]]
id = "schematic"
file = "crates/horizon-client/src/game.rs"
name = "worldedit_schem"
source = "schematic.rs"

# The 1.12 to 1.13 block table a `.schematic` needs, from gen_legacy.py.
[[module]]
id = "legacy"
file = "crates/horizon-client/src/game.rs"
name = "worldedit_legacy"
source = "legacy_ids.rs"

# A command typed here (single player, in frame, or the machine hosting a LAN
# world or dedicated server). `//set` arrives as `/set`.
[[injection]]
id = "command"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::commands::Game<'_>::run_command"
helper = "command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "command", ty = "&str", value = "command" },
]

# A command from a guest of a hosted world: queued unmodified, so the server
# runs it with that player's state in place (`as_guest`).
[[injection]]
id = "guest-command"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::lan_actions::Game<'_>::guest_command"
helper = "guest-command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "host", ty = "&mut crate::game::lan::LanHost", value = "&mut *host" },
  { name = "conn", ty = "u32", value = "conn" },
  { name = "command", ty = "&str", value = "command" },
]

# The chat screen's completions: `//set` is no command of the vanilla tree, so
# its parse failed and the screen showed "Unknown or incomplete command". The
# editor completes its own prefix instead, names and arguments.
[[injection]]
id = "chat-suggestions"
kind = "HEAD"
cancellable = true
target = "horizon_client::chat::ChatScreen::update_command_info"
helper = "chat-hook.rs"
bindings = [
  { name = "screen", ty = "&mut crate::chat::ChatScreen", value = "self" },
  { name = "m", ty = "&crate::screen_draw::Measure", value = "m" },
  { name = "c", ty = "&crate::chat::Commands<'_>", value = "c" },
]

# The completions' table, staged into chat.rs as `mod worldedit_chat`.
[[module]]
id = "chat"
file = "crates/horizon-client/src/chat.rs"
name = "worldedit_chat"
source = "chat-suggestions.rs"

# The wand: left click sets position 1, right click position 2, while the
# wooden axe `//wand` gave is held. The click is taken before the game starts
# mining or using an item.
[[injection]]
id = "wand"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::Game<'_>::play_mouse"
helper = "wand.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "button", ty = "winit::event::MouseButton", value = "button" },
  { name = "pressed", ty = "bool", value = "pressed" },
]
[compatibility]
# The Horizon source this bundle is planned and built on: Nightly 2026-10-28.
# A launcher build uses this commit's source. Planning it against another tree
# means changing this line to that tree's commit (or dropping the section: a
# bundle without a pin builds on the installed version's commit).
horizon_revision = "83f15fa276c44711276b6ceb5f0fe0c9c534dc66"
